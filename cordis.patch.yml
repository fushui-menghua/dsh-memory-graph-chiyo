# ============================================================================
# dsh-memory-graph-chiyo —— DSH bundle patch
# 装上之后，profile 在 dsh.profile.bundles 里列出本包名即生效：
#   dsh plugin --profile web add dsh-memory-graph-chiyo
# ============================================================================
- insert:
    - id: memory-graph
      name: dsh-memory-graph-chiyo
      config:
        # 数据目录默认为 ~/.dsh/memory-graph，scope 默认为 agent:memory
        scope: agent:memory